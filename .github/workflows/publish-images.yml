name: CD
# Fork-only verification snapshot: deploy is hard-disabled; only personal test images are pushed.

on:
  push:
    branches: [ci/cd-fork-test]

permissions:
  contents: read

concurrency:
  group: storyfork-fork-test-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish fork test images
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.repository == 'Seongho-haru/SKN34-FINAL-4TEAM' && github.event_name == 'push' && github.ref == 'refs/heads/ci/cd-fork-test') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Build and push fork test images
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          export DOCKER_CONFIG="$scratch"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for service in web core-api ai-service; do
            image="ghcr.io/seongho-haru/storyfork-cd-test-$service"
            context="backend/$service"
            if [[ "$service" == web ]]; then context=frontend; fi
            docker build --platform linux/amd64 \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$TARGET_SHA" \
              --tag "$image:sha-$TARGET_SHA" "$context"
            docker push "$image:sha-$TARGET_SHA"
          done

  deploy:
    name: Deploy develop images
    needs: publish
    # publish가 같은 저장소 develop의 CI 성공 또는 명시적인 develop 수동 실행만 허용한다.
    # workflow_run의 ref는 기본 브랜치, 수동 실행의 ref는 develop이므로 main-only 검사는 하지 않는다.
    if: ${{ false }} # Fork test: never execute server/Tailscale/SSH steps.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: develop-cd
    env:
      SSH_DIR: /tmp/storyfork-ssh-disabled # Hard-disabled job; runner context is invalid at job env scope.
      CD_DEPLOY_DIR: ${{ vars.CD_DEPLOY_DIR }}
      CD_WEB_PORT: ${{ vars.CD_WEB_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:storyfork-cd
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
      - name: Pull and start develop images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            # 설정과 토큰은 명령 인자가 아닌 암호화된 SSH stdin으로 전달한다.
            printf '%s=%q\n' CD_DIRECTORY "$CD_DEPLOY_DIR" CD_WEB_PORT "$CD_WEB_PORT" \
              GITHUB_ACTOR "$GITHUB_ACTOR" GH_TOKEN "$GH_TOKEN" \
              COMPOSE_BASE_YAML "$(< infrastructure/docker-compose.yaml)" \
              COMPOSE_DEV_YAML "$(< infrastructure/docker-compose.dev.yaml)"
            cat <<'REMOTE'
          set -euo pipefail
          umask 077
          cd -P -- "$CD_DIRECTORY"
          [[ "$PWD" == "$CD_DIRECTORY" && -f .env ]] || exit 1
          export CD_DIRECTORY CD_WEB_PORT COMPOSE_PROJECT_NAME=storyfork-develop-cd DOCKER_HOST=unix:///var/run/docker.sock
          unset DOCKER_CONTEXT
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          export COMPOSE_FILE="$DOCKER_CONFIG/docker-compose.yaml:$DOCKER_CONFIG/docker-compose.dev.yaml"
          printf '%s\n' "$COMPOSE_BASE_YAML" > "$DOCKER_CONFIG/docker-compose.yaml"
          printf '%s\n' "$COMPOSE_DEV_YAML" > "$DOCKER_CONFIG/docker-compose.dev.yaml"

          # 같은 프로젝트 이름을 사용하는 다른 배포는 변경하지 않는다.
          containers=$(docker container ls --all --quiet --filter label=com.docker.compose.project=storyfork-develop-cd)
          for container in $containers; do
            [[ "$(docker container inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container")" == "$CD_DIRECTORY" ]] || exit 1
          done

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GH_TOKEN
          # 서버 .env의 과거 image override 대신 최신 develop을 사용한다.
          export CD_WEB_IMAGE=ghcr.io/sknetworks-family-aicamp/storyfork-web:develop
          export CD_CORE_API_IMAGE=ghcr.io/sknetworks-family-aicamp/storyfork-core-api:develop
          export CD_AI_SERVICE_IMAGE=ghcr.io/sknetworks-family-aicamp/storyfork-ai-service:develop
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env pull
          images=$(docker compose --project-directory "$CD_DIRECTORY" --env-file .env config --images)
          revisions=$(docker image inspect $images --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' | sort -u)
          [[ "$revisions" =~ ^[0-9a-f]{40}$ ]] || { printf 'Mixed or missing develop image revisions; rerun CD.\n' >&2; exit 1; }
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env up -d --no-build --pull never --wait --wait-timeout 180
          REMOTE
          } | ssh -F /dev/null -T -p 5798 -i "$SSH_DIR/key" \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 \
            tgv99536@100.90.8.124 'bash -se'
      - name: Clean up SSH credentials
        if: ${{ always() }}
        run: rm -rf -- "$SSH_DIR"
