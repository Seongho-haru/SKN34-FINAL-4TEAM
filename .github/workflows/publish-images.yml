name: CD
# 개인 Fork 전용: 이미 게시·검증된 SHA 이미지를 별도 서버 프로젝트에 배포한다.
on:
  push:
    branches: [ci/cd-fork-test]

permissions:
  contents: read

concurrency:
  group: storyfork-fork-server-cd-test
  cancel-in-progress: false

env:
  IMAGE_SHA: 660c994b9947ab9637fc2ae26f5bba2439948c8f
  CD_WEB_IMAGE: ghcr.io/seongho-haru/storyfork-cd-test-web@sha256:5d20615b6128a58d715be1c5857cbb95bfa536f48196d2d976d0edb3c2ce0937
  CD_CORE_API_IMAGE: ghcr.io/seongho-haru/storyfork-cd-test-core-api@sha256:b92d7dee944141293c881bfc03cd05c536b290c46cb9930c5b1385d4ffa2821d
  CD_AI_SERVICE_IMAGE: ghcr.io/seongho-haru/storyfork-cd-test-ai-service@sha256:5460145da33488c9b09f7e53441a4dbe4ca46832e33466bc405f8e895b76d2c3

jobs:
  publish:
    name: Verify previously published fork images
    # 기존 정적 CD 계약을 유지한다. 이 variant의 유일한 trigger는 위의 개인 테스트 브랜치 push다.
    if: ${{ github.repository == 'Seongho-haru/SKN34-FINAL-4TEAM' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) || (github.event_name == 'push' && github.ref == 'refs/heads/ci/cd-fork-test')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable manifests without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in "$CD_WEB_IMAGE" "$CD_CORE_API_IMAGE" "$CD_AI_SERVICE_IMAGE"; do
            docker manifest inspect "$image" > /dev/null
          done

  deploy:
    name: Deploy isolated fork server test
    needs: publish
    if: ${{ needs.publish.result == 'success' && github.repository == 'Seongho-haru/SKN34-FINAL-4TEAM' && github.event_name == 'push' && github.ref == 'refs/heads/ci/cd-fork-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
    environment: develop-cd
    env:
      # 저장소의 실제 CD_DEPLOY_DIR/기존8088 스택은 사용하지 않는다.
      CD_DEPLOY_DIR: /home/tgv99536/storyfork-cd-test
      CD_WEB_PORT: "8081"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:storyfork-cd
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          SSH_DIR="$RUNNER_TEMP/storyfork-ssh"
          printf 'SSH_DIR=%s\n' "$SSH_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
      - name: Pull and start isolated test images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf '%s=%q\n' CD_DIRECTORY "$CD_DEPLOY_DIR" CD_WEB_PORT "$CD_WEB_PORT" \
              GITHUB_ACTOR "$GITHUB_ACTOR" GH_TOKEN "$GH_TOKEN" IMAGE_SHA "$IMAGE_SHA" \
              CD_WEB_IMAGE "$CD_WEB_IMAGE" CD_CORE_API_IMAGE "$CD_CORE_API_IMAGE" CD_AI_SERVICE_IMAGE "$CD_AI_SERVICE_IMAGE" \
              COMPOSE_BASE_YAML "$(< infrastructure/docker-compose.yaml)" \
              COMPOSE_PROD_YAML "$(< infrastructure/docker-compose.prod.yaml)" \
              COMPOSE_CI_YAML "$(< infrastructure/ci/compose.test.yaml)"
            cat <<'REMOTE'
          set -euo pipefail
          umask 077
          [[ "$CD_DIRECTORY" == /home/tgv99536/storyfork-cd-test && "$CD_WEB_PORT" == 8081 ]] || exit 1
          [[ ! -L "$CD_DIRECTORY" && -O "$CD_DIRECTORY" ]] || exit 1
          cd -P -- "$CD_DIRECTORY"
          [[ "$PWD" == "$CD_DIRECTORY" && -f .env && ! -L .env && -O .env && "$(stat -c '%a' .env)" == 600 ]] || exit 1
          printf 'REMOTE_IDENTITY %s %s %s\n' "$PWD" "$(whoami)" "$(hostname)"
          export CD_DIRECTORY CD_WEB_PORT CD_WEB_IMAGE CD_CORE_API_IMAGE CD_AI_SERVICE_IMAGE
          export COMPOSE_PROJECT_NAME=storyfork-fork-cd-test DOCKER_HOST=unix:///var/run/docker.sock
          unset DOCKER_CONTEXT
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          export COMPOSE_FILE="$CD_DIRECTORY/docker-compose.yaml:$CD_DIRECTORY/docker-compose.prod.yaml:$CD_DIRECTORY/compose.ci.yaml:$CD_DIRECTORY/compose.fork-test.yaml"
          containers=$(docker container ls --all --quiet --filter label=com.docker.compose.project=storyfork-fork-cd-test)
          for container in $containers; do
            [[ "$(docker container inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container")" == "$CD_DIRECTORY" ]] || exit 1
          done
          printf '%s\n' "$COMPOSE_BASE_YAML" > docker-compose.yaml
          printf '%s\n' "$COMPOSE_PROD_YAML" > docker-compose.prod.yaml
          printf '%s\n' "$COMPOSE_CI_YAML" > compose.ci.yaml
          cat > compose.fork-test.yaml <<'COMPOSE'
          # 일회성 CI DB/Mailpit 격리 + 개인 GHCR 이미지 전용, 원본/공유 DB 미접속.
          services:
            mailpit:
              ports: !reset []
            ai-service:
              build: !reset null
              image: ${CD_AI_SERVICE_IMAGE:?Pinned personal image required}
              platform: linux/amd64
            core-api:
              build: !reset null
              image: ${CD_CORE_API_IMAGE:?Pinned personal image required}
              platform: linux/amd64
              environment:
                APP_CORS_ALLOWED_ORIGIN: http://127.0.0.1:8081
            web:
              build: !reset null
              image: ${CD_WEB_IMAGE:?Pinned personal image required}
              platform: linux/amd64
              ports: !override ["127.0.0.1:8081:80"]
          COMPOSE
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env config --quiet
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GH_TOKEN
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env pull
          for image in "$CD_WEB_IMAGE" "$CD_CORE_API_IMAGE" "$CD_AI_SERVICE_IMAGE"; do
            revision=$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [[ "$revision" == "$IMAGE_SHA" ]] || exit 1
            printf 'PULLED_REVISION %s %s\n' "$image" "$revision"
          done
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env up -d --no-build --pull never --wait --wait-timeout 180
          for path in / /api/v1/health /api/v1/health/ai-service; do
            curl --noproxy '*' --retry 60 --retry-delay 2 --retry-all-errors --max-time 10 --fail --silent --show-error --output /dev/null "http://127.0.0.1:8081$path"
            printf 'HTTP_READY %s 200\n' "$path"
          done
          code=$(curl --noproxy '*' --max-time 10 --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/v1/me)
          [[ "$code" == 401 ]] || exit 1
          printf 'HTTP_ANONYMOUS /api/v1/me %s\n' "$code"
          docker compose --project-directory "$CD_DIRECTORY" --env-file .env ps
          printf 'FORK_SERVER_DEPLOY_COMPLETE\n'
          REMOTE
          } | ssh -F /dev/null -T -p 5798 -i "$SSH_DIR/key" \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ForwardAgent=no -o ClearAllForwardings=yes -o ConnectTimeout=15 \
            tgv99536@100.90.8.124 'bash -se'
      - name: Clean up SSH credentials
        if: ${{ always() }}
        run: |
          if [[ -n "${SSH_DIR:-}" ]]; then rm -rf -- "$SSH_DIR"; fi
